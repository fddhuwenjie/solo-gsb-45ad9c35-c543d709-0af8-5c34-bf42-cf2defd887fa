services:
  rehearsal:
    build: .
    image: rehearsal-script:latest
    container_name: rehearsal-script
    ports:
      - "8000:8000"
    volumes:
      - rehearsal-data:/data
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  rehearsal-data:
